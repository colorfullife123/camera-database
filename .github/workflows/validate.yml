name: Validate camera database
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source, assets and published manifest
        run: python3 tools/check_release.py
      - name: Validate update source catalog
        run: python3 tools/check_mirrors.py --catalog-only
